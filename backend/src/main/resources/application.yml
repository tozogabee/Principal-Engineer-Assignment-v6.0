spring:
  application:
    name: principal-realtime-backend
  profiles:
    default: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:telemetry}
    username: ${POSTGRES_USER:app}
    password: ${POSTGRES_PASSWORD:app}
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

---
spring:
  config:
    activate:
      on-profile: secure
  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: classpath:keys/public.pem
